name: Release

# Tag a commit "v1.2.3" and push the tag: this builds, signs, notarizes, and publishes a GitHub Release
# with the .dmg on the public site repo (aaronfisher/sticky-windows), then commits the updated Sparkle
# appcast there so GitHub Pages serves it. Needs a SITE_REPO_TOKEN secret (fine-grained PAT with
# Contents: write on that repo) in addition to the signing and notary secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check out site repo
        uses: actions/checkout@v4
        with:
          repository: aaronfisher/sticky-windows
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Prepare notarization and Sparkle keys
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_private.key"

      - name: Build, notarize, package
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_FILE: ${{ runner.temp }}/AuthKey.p8
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle_private.key
          SITE_DIR: ${{ github.workspace }}/site
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x scripts/*.sh
          scripts/release.sh "$VERSION" "$GITHUB_RUN_NUMBER"

      - name: Publish release on the site repo
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/release/StickyWindows-$VERSION.dmg" \
            --repo aaronfisher/sticky-windows --title "Sticky Windows $VERSION" --notes "Sticky Windows $VERSION"

      - name: Commit appcast to the site repo
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Appcast: ${GITHUB_REF_NAME}" || exit 0
          git push
