name: StickyWindows
options:
  bundleIdPrefix: vc.theshirleycompany
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # The Shirley Company LLC. Automatic signing with an Apple Development certificate (Xcode creates it on
    # first build) gives every build the same identity, so macOS keeps the app's Accessibility permission.
    # Distribution (M7) will need a Developer ID Application certificate for this team.
    DEVELOPMENT_TEAM: F5N4RH3674
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  StickyWindows:
    type: application
    platform: macOS
    sources:
      - path: StickyWindows
        excludes:
          - "Resources/AppIcon.icon/**"
      # Icon Composer file: added as one file so Xcode compiles it (Liquid Glass + fallbacks for older macOS).
      - path: StickyWindows/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - package: Sparkle
    info:
      path: StickyWindows/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sticky Windows
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: © 2026 The Shirley Company LLC
        LSMinimumSystemVersion: "15.0"
        # Sparkle
        SUFeedURL: https://aaronfisher.github.io/sticky-windows/appcast.xml
        SUPublicEDKey: lqvdEdmyX6ncEW9uu8fjjcjfcC57nevid6gCmcNn5Vg=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vc.theshirleycompany.StickyWindows
        PRODUCT_NAME: "Sticky Windows"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: StickyWindows/Resources/StickyWindows.entitlements
        ENABLE_APP_SANDBOX: NO
      configs:
        Release:
          # Distribution outside the App Store: Developer ID, both architectures. Needs the team's
          # "Developer ID Application" certificate in the keychain (locally or in CI).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          PROVISIONING_PROFILE_SPECIFIER: ""
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: NO
schemes:
  StickyWindows:
    build:
      targets:
        StickyWindows: all
    run:
      config: Debug
